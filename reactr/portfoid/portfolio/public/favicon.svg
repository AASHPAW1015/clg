<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- background -->
  <rect width="16" height="16" fill="#FBF6EC"/>

  <!-- monitor frame -->
  <rect x="1" y="0" width="14" height="10" fill="#16130F"/>

  <!-- screen -->
  <rect x="2" y="1" width="12" height="8" fill="#4B88F8"/>

  <!-- screen highlight (top-left L) -->
  <rect x="2" y="1" width="4" height="1" fill="#8EC5FF"/>
  <rect x="2" y="2" width="1" height="2" fill="#8EC5FF"/>

  <!-- stand neck -->
  <rect x="7" y="10" width="2" height="2" fill="#16130F"/>

  <!-- stand base -->
  <rect x="4" y="12" width="8" height="2" fill="#16130F"/>
</svg>
