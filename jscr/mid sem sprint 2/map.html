<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ParkPoint – Find Driveway Parking</title>
  <meta name="description"
    content="Locate, filter, and book private driveway parking spaces in real-time across Mumbai." />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Our Styles -->
  <link rel="stylesheet" href="index.css" />
</head>

<body>

  <!-- THE MAP -->
  <div id="map"></div>

  <!-- TOP BAR: Filters + Search -->
  <div class="top-bar" id="topBar">

    <!-- Filter Dropdown -->
    <div class="dropdown">
      <button class="dropdown-toggle" id="filterToggleBtn">
        <i class="fa-solid fa-sliders"></i>
        <span>Filters</span>
        <i class="fa-solid fa-chevron-down" style="font-size:.7rem;"></i>
      </button>
      <div class="dropdown-menu" id="filterMenu">
        <label class="dropdown-item">
          <input type="checkbox" id="chkEV" />
          <i class="fa-solid fa-bolt text-green"></i>
          <span>EV Friendly</span>
        </label>
        <label class="dropdown-item">
          <input type="checkbox" id="chkLarge" />
          <i class="fa-solid fa-truck text-amber"></i>
          <span>Large Vehicle Access</span>
        </label>
        <label class="dropdown-item">
          <input type="checkbox" id="chkLowPrice" />
          <i class="fa-solid fa-tag text-green"></i>
          <span>Low Price (≤ ₹100/hr)</span>
        </label>
      </div>
    </div>

    <!-- Divider line -->
    <div style="width:1px; height:24px; background:rgba(255,255,255,0.1);"></div>

    <!-- Search box -->
    <div style="display:flex; align-items:center; gap:8px; flex:1;">
      <i class="fa-solid fa-magnifying-glass" style="color:#484f58;"></i>
      <input type="text" class="input-field" id="searchInput" placeholder="Search locality…" style="flex:1;" />
    </div>
  </div>

  <!-- LEFT PANEL: Spot Details -->
  <div class="panel-left hidden" id="panelLeft">
    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
      <h2 id="spotName" style="font-size:1.2rem; font-weight:700;">—</h2>
      <button id="panelClose" style="background:none; border:none; color:#8b949e; cursor:pointer; font-size:1.1rem;">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <p id="spotLocality" class="text-muted" style="font-size:.85rem; margin-top:2px;"></p>

    <!-- Rating -->
    <div class="detail-row" style="margin-top:14px;">
      <i class="fa-solid fa-star" style="color:#ffab00;"></i>
      <span id="spotRating">—</span>
      <span class="text-muted" style="margin-left:auto; font-size:.8rem;" id="spotSize"></span>
    </div>

    <!-- Amenities -->
    <div style="margin-top:14px;">
      <span class="text-muted"
        style="font-size:.75rem; text-transform:uppercase; letter-spacing:1px;">Specialities</span>
      <div class="amenity-tags" id="spotAmenities"></div>
    </div>

    <!-- Google Maps link -->
    <div class="detail-row" style="margin-top:14px;">
      <i class="fa-solid fa-map-location-dot"></i>
      <a id="spotGmaps" href="#" target="_blank">Open in Google Maps</a>
    </div>

    <!-- Book button -->
    <a class="btn btn-primary" id="bookBtn" href="#" style="margin-top:20px; width:100%; text-align:center;">
      <i class="fa-solid fa-calendar-check"></i>
      Book Spot
    </a>
  </div>

  <!-- RIGHT: Price Card -->
  <div class="price-card hidden" id="priceCard">
    <div class="price-value" id="priceValue">—</div>
    <div class="price-unit">/hr</div>
    <div class="peak-label" id="peakLabel">⚡ Dynamic Pricing Active (Peak)</div>
  </div>

  <!-- BOTTOM RIGHT: Peak Toggle -->
  <div class="peak-toggle-box">
    <div class="toggle-wrapper">
      <span class="toggle-label">Peak Hours</span>
      <input type="checkbox" class="toggle" id="peakToggle" />
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="data.js"></script>
  <script src="map.js"></script>
</body>

</html>
